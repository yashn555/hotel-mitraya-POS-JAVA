<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Mitraya — POS & Billing Security Login</title>
    
    <!-- Meta tags for mobile web app -->
    <meta name="theme-color" content="#0d1b2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Hotel Mitraya Quick POS & Secured Billing System Login">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #070d14;
            --bg-surface: rgba(18, 30, 49, 0.85);
            --bg-card: rgba(23, 38, 60, 0.9);
            --border-glow: rgba(56, 189, 248, 0.3);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --accent-primary: #38bdf8;
            --accent-gold: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #172d47 0%, #0d1b2a 50%, #070d14 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .ambient-glow-1 {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.09), transparent 70%);
            bottom: -50px;
            right: 10%;
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px 26px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75),
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
            animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .brand-header {
            margin-bottom: 20px;
        }

        .brand-logo-container {
            width: 76px;
            height: 76px;
            margin: 0 auto 12px;
            background: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.5),
                        0 0 0 3px rgba(56, 189, 248, 0.35);
            overflow: hidden;
            padding: 6px;
            transition: transform 0.2s ease;
        }

        .brand-logo-container:hover {
            transform: scale(1.05);
        }

        .hotel-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-title {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        /* Role Selector Tabs */
        .role-selector-wrapper {
            margin: 18px 0 16px;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(10, 18, 30, 0.7);
            padding: 5px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        .role-tab-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-tab-btn i {
            font-size: 14px;
        }

        .role-tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(2, 132, 199, 0.35));
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .role-tab-btn:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .role-badge-info {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
            min-height: 18px;
        }

        /* PIN Display Area */
        .pin-display-wrapper {
            margin: 16px 0 16px;
            position: relative;
        }

        .pin-input-hidden {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        .pin-indicators {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(10, 18, 30, 0.7);
            border: 1.5px solid rgba(56, 189, 248, 0.2);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pin-indicators:hover,
        .pin-indicators.focused {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .pin-indicators.error {
            border-color: var(--accent-rose);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .pin-slot {
            width: 44px;
            height: 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            transition: all 0.15s ease;
        }

        .pin-slot.filled {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.5);
            color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        .pin-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .pin-toggle-btn:hover {
            color: var(--text-main);
        }

        /* Error Message Banner */
        .error-message {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #fecdd3;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 16px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Keypad Grid */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 18px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            height: 50px;
            color: #ffffff;
            font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
            user-select: none;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: scale(0.95);
            background: rgba(56, 189, 248, 0.25);
            border-color: var(--accent-primary);
        }

        .key-btn.key-action {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-size: 15px;
        }

        .key-btn.key-action:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Unlock Button */
        .btn-unlock {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn-unlock:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            box-shadow: 0 12px 25px -4px rgba(2, 132, 199, 0.6);
            transform: translateY(-1px);
        }

        .btn-unlock:active {
            transform: translateY(1px);
        }

        .btn-unlock:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-logo-container">
                <img src="/static/logo.png" alt="Hotel Mitraya Logo" class="hotel-logo-img">
            </div>
            <h1 class="brand-title">HOTEL MITRAYA</h1>
            <div class="brand-subtitle">
                <i class="fa-solid fa-shield-halved"></i> Secured POS &amp; Billing
            </div>
        </div>

        <!-- Role Selector Tabs -->
        <div class="role-selector-wrapper">
            <div class="role-tabs">
                <button type="button" class="role-tab-btn active" id="tab-admin" data-role="admin">
                    <i class="fa-solid fa-user-shield"></i> Admin
                </button>
                <button type="button" class="role-tab-btn" id="tab-cashier" data-role="cashier">
                    <i class="fa-solid fa-cash-register"></i> Cashier
                </button>
            </div>
            <div class="role-badge-info" id="role-info-text">
                <i class="fa-solid fa-circle-info"></i> Admin: Dashboard, POS, Menu, Bulk Billing
            </div>
        </div>

        <!-- Hidden input for keyboard entry -->
        <input type="password" id="hidden-pin-input" class="pin-input-hidden" maxlength="8" inputmode="numeric" autocomplete="one-time-code" autofocus>

        <!-- PIN Slots Display -->
        <div class="pin-display-wrapper" id="pin-wrapper">
            <div class="pin-indicators focused" id="pin-indicators" title="Click to enter PIN">
                <div class="pin-slot" id="slot-0"></div>
                <div class="pin-slot" id="slot-1"></div>
                <div class="pin-slot" id="slot-2"></div>
                <div class="pin-slot" id="slot-3"></div>
            </div>
            <button type="button" class="pin-toggle-btn" id="btn-toggle-mask" title="Show/Hide PIN">
                <i class="fa-solid fa-eye" id="toggle-icon"></i>
            </button>
        </div>

        <!-- Error Message Banner -->
        <div class="error-message" id="error-banner">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="error-text">Incorrect PIN. Access denied.</span>
        </div>

        <!-- On-Screen Keypad -->
        <div class="keypad-grid">
            <button type="button" class="key-btn" data-key="1">1</button>
            <button type="button" class="key-btn" data-key="2">2</button>
            <button type="button" class="key-btn" data-key="3">3</button>
            
            <button type="button" class="key-btn" data-key="4">4</button>
            <button type="button" class="key-btn" data-key="5">5</button>
            <button type="button" class="key-btn" data-key="6">6</button>
            
            <button type="button" class="key-btn" data-key="7">7</button>
            <button type="button" class="key-btn" data-key="8">8</button>
            <button type="button" class="key-btn" data-key="9">9</button>
            
            <button type="button" class="key-btn key-action" id="btn-clear" title="Clear">CLR</button>
            <button type="button" class="key-btn" data-key="0">0</button>
            <button type="button" class="key-btn key-action" id="btn-backspace" title="Backspace">
                <i class="fa-solid fa-delete-left"></i>
            </button>
        </div>

        <!-- Submit Button -->
        <button type="button" class="btn-unlock" id="btn-submit-pin">
            <span id="btn-text"><i class="fa-solid fa-unlock-keyhole"></i> Sign In to POS</span>
            <i class="fa-solid fa-spinner fa-spin" id="btn-spinner" style="display: none;"></i>
        </button>

        <div class="footer-note">
            <i class="fa-solid fa-lock"></i> Protected Instance &bull; Authorized Personnel Only
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            let selectedRole = "admin";
            let currentPin = "";
            let isMasked = true;
            const maxPinLength = 4;

            const tabAdmin = document.getElementById("tab-admin");
            const tabCashier = document.getElementById("tab-cashier");
            const roleInfoText = document.getElementById("role-info-text");
            const hiddenInput = document.getElementById("hidden-pin-input");
            const pinIndicators = document.getElementById("pin-indicators");
            const errorBanner = document.getElementById("error-banner");
            const errorText = document.getElementById("error-text");
            const btnSubmit = document.getElementById("btn-submit-pin");
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");
            const btnToggleMask = document.getElementById("btn-toggle-mask");
            const toggleIcon = document.getElementById("toggle-icon");
            const keyButtons = document.querySelectorAll(".key-btn[data-key]");
            const btnClear = document.getElementById("btn-clear");
            const btnBackspace = document.getElementById("btn-backspace");

            function setRole(role) {
                selectedRole = role;
                if (role === "admin") {
                    tabAdmin.classList.add("active");
                    tabCashier.classList.remove("active");
                    roleInfoText.innerHTML = '<i class="fa-solid fa-circle-info"></i> Admin: Dashboard, POS, Menu, Bulk Billing';
                    btnText.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Unlock Admin Access';
                } else {
                    tabCashier.classList.add("active");
                    tabAdmin.classList.remove("active");
                    roleInfoText.innerHTML = '<i class="fa-solid fa-circle-info"></i> Cashier: Direct Access to Quick POS Billing';
                    btnText.innerHTML = '<i class="fa-solid fa-cash-register"></i> Open Quick POS';
                }
                clearPin();
                hiddenInput.focus();
            }

            tabAdmin.addEventListener("click", () => setRole("admin"));
            tabCashier.addEventListener("click", () => setRole("cashier"));

            function updateSlots() {
                for (let i = 0; i < 4; i++) {
                    const slot = document.getElementById(`slot-${i}`);
                    if (!slot) continue;

                    if (i < currentPin.length) {
                        slot.classList.add("filled");
                        slot.textContent = isMasked ? "●" : currentPin[i];
                    } else {
                        slot.classList.remove("filled");
                        slot.textContent = "";
                    }
                }

                if (errorBanner.style.display === "flex") {
                    errorBanner.style.display = "none";
                    pinIndicators.classList.remove("error");
                }
            }

            function addDigit(digit) {
                if (currentPin.length < maxPinLength) {
                    currentPin += digit;
                    hiddenInput.value = currentPin;
                    updateSlots();

                    if (currentPin.length === maxPinLength) {
                        setTimeout(submitPin, 120);
                    }
                }
            }

            function removeDigit() {
                if (currentPin.length > 0) {
                    currentPin = currentPin.slice(0, -1);
                    hiddenInput.value = currentPin;
                    updateSlots();
                }
            }

            function clearPin() {
                currentPin = "";
                hiddenInput.value = "";
                updateSlots();
            }

            async function submitPin() {
                if (!currentPin) {
                    showError("Please enter your PIN code.");
                    return;
                }

                btnSubmit.disabled = true;
                btnText.style.display = "none";
                btnSpinner.style.display = "inline-block";

                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get("next") || "";

                try {
                    const res = await fetch("/api/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            pin: currentPin,
                            role: selectedRole,
                            next: nextUrl
                        })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        btnText.innerHTML = '<i class="fa-solid fa-check"></i> Unlocked!';
                        btnText.style.display = "inline-block";
                        btnSpinner.style.display = "none";
                        window.location.href = data.redirect || (selectedRole === "admin" ? "/admin" : "/pos");
                    } else {
                        showError(data.error || "Incorrect PIN. Access denied.");
                        btnSubmit.disabled = false;
                        btnText.style.display = "inline-block";
                        btnSpinner.style.display = "none";
                    }
                } catch (err) {
                    showError("Network error. Please try again.");
                    btnSubmit.disabled = false;
                    btnText.style.display = "inline-block";
                    btnSpinner.style.display = "none";
                }
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorBanner.style.display = "flex";
                pinIndicators.classList.add("error");
                
                setTimeout(() => {
                    clearPin();
                    hiddenInput.focus();
                }, 400);
            }

            keyButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    addDigit(btn.getAttribute("data-key"));
                });
            });

            btnClear.addEventListener("click", clearPin);
            btnBackspace.addEventListener("click", removeDigit);
            btnSubmit.addEventListener("click", submitPin);

            btnToggleMask.addEventListener("click", () => {
                isMasked = !isMasked;
                toggleIcon.className = isMasked ? "fa-solid fa-eye" : "fa-solid fa-eye-slash";
                updateSlots();
            });

            pinIndicators.addEventListener("click", () => {
                hiddenInput.focus();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key >= "0" && e.key <= "9") {
                    addDigit(e.key);
                } else if (e.key === "Backspace") {
                    removeDigit();
                } else if (e.key === "Escape") {
                    clearPin();
                } else if (e.key === "Enter") {
                    submitPin();
                }
            });

            window.addEventListener("DOMContentLoaded", () => {
                hiddenInput.focus();
            });
        })();
    </script>
</body>
</html>
