<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wired Print &amp; Order Display Station — Hotel Mitraya</title>

    <meta name="theme-color" content="#0a1017">
    <link rel="icon" type="image/png" href="/static/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-darker: #0a1017;
            --bg-dark: #0f172a;
            --bg-card: #111927;
            --bg-surface: #162235;
            --border-subtle: #1e293b;
            --card-border: #24354c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-emerald: #10b981;
            --accent-gold: #f59e0b;
            --accent-rose: #ef4444;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        .display-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .display-brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .display-logo-img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .display-brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fbbf24;
        }

        .display-brand-tag {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .live-status-pill.checking {
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(59, 130, 246, 0.35);
            color: #60a5fa;
        }

        .live-status-pill.warning {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.35);
            color: #fbbf24;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-toggle-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .header-toggle-badge input[type="checkbox"] {
            accent-color: #10b981;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .header-nav-btn {
            background: var(--bg-surface);
            color: #f1f5f9;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-nav-btn:hover {
            background: #1e293b;
            border-color: #3b82f6;
        }

        /* 12 Tables Radar Section */
        .tables-radar-section {
            background: #0c1420;
            border-bottom: 1px solid var(--card-border);
            padding: 12px 20px;
        }

        .radar-header {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tables-grid-bar {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
        }

        @media (max-width: 900px) {
            .tables-grid-bar {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .table-radar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .table-radar-card.vacant {
            border-color: rgba(16, 185, 129, 0.25);
            background: rgba(16, 185, 129, 0.04);
        }

        .table-radar-card.occupied {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.1);
        }

        .table-radar-num {
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
        }

        .table-radar-status {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .table-radar-card.occupied .table-radar-status {
            color: #fca5a5;
            font-weight: 700;
        }

        /* 2-Second Active Order Pop-Up Alert Modal */
        .live-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 10, 20, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .live-alert-overlay.active {
            display: flex;
        }

        .alert-card {
            background: var(--bg-card);
            border: 2px solid var(--accent-primary);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            animation: alertSlideIn 0.2s ease;
        }

        @keyframes alertSlideIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .alert-top-banner {
            background: var(--bg-surface);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .alert-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .countdown-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .countdown-progress-bar-container {
            height: 4px;
            background: #1e293b;
            width: 100%;
        }

        .countdown-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 100%;
            transition: width 0.2s linear;
        }

        .alert-body {
            padding: 18px;
        }

        .alert-table-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .alert-table-tag {
            font-size: 18px;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-bill-tag {
            font-size: 13px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.12);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .alert-items-list {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .alert-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .alert-item-qty {
            font-weight: 800;
            color: #38bdf8;
            margin-right: 8px;
            min-width: 24px;
        }

        .alert-item-name {
            color: #f1f5f9;
            font-weight: 600;
        }

        .alert-item-rate {
            font-family: var(--font-mono);
            font-weight: 700;
            color: #cbd5e1;
        }

        .alert-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .alert-total-val {
            font-size: 20px;
            font-weight: 800;
            color: #34d399;
            font-family: var(--font-mono);
        }

        .alert-actions {
            padding: 14px 18px;
            background: var(--bg-surface);
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .btn-alert-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-print-wired {
            background: #2563eb;
            color: #fff;
        }

        .btn-print-wired:hover {
            background: #1d4ed8;
        }

        .btn-pause-timer {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid var(--border-subtle);
        }

        .btn-dismiss-alert {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            max-width: 90px;
        }

        /* Feed section */
        .feed-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .feed-header h2 {
            font-size: 17px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
        }

        .feed-badge {
            font-size: 11px;
            background: rgba(37, 99, 235, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .order-card {
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s ease;
        }

        .order-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .order-card.dining {
            border-left: 4px solid #f59e0b;
        }

        .order-card.walk-in {
            border-left: 4px solid #3b82f6;
        }

        .order-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .order-card-table {
            font-size: 14px;
            font-weight: 800;
            color: #f8fafc;
        }

        .order-card-time {
            font-size: 11px;
            color: #94a3b8;
            font-family: var(--font-mono);
        }

        .order-card-items-snippet {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.4;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-subtle);
            padding-top: 10px;
        }

        .order-card-total {
            font-size: 15px;
            font-weight: 800;
            color: #34d399;
            font-family: var(--font-mono);
        }

        .btn-card-reprint {
            background: #1e293b;
            color: #93c5fd;
            border: 1px solid #3b82f6;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-card-reprint:hover {
            background: #2563eb;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- Display Header -->
    <header class="display-header">
        <a href="/pos" class="display-brand-group">
            <img src="/static/logo.png" alt="Hotel Mitraya Logo" class="display-logo-img">
            <div>
                <h1 class="display-brand-title">HOTEL MITRAYA</h1>
                <span class="display-brand-tag"><i class="fa-solid fa-print"></i> Wired Thermal Print &amp; Display Station</span>
            </div>
        </a>

        <!-- Wired Printer Diagnostic Status -->
        <div class="live-status-pill checking" id="printer-status-pill">
            <span class="pulse-dot"></span>
            <span id="printer-status-text">Checking Wired Printers...</span>
        </div>

        <div class="header-actions">
            <button type="button" class="header-nav-btn" id="btn-redetect-printer" title="Re-detect wired printers and print confirmation">
                <i class="fa-solid fa-rotate"></i> Test Wired Printer
            </button>

            <div class="header-toggle-badge">
                <input type="checkbox" id="toggle-autoprint" checked>
                <label for="toggle-autoprint" style="cursor: pointer;">Auto-Print (Wired)</label>
            </div>

            <div class="header-toggle-badge">
                <input type="checkbox" id="toggle-sound" checked>
                <label for="toggle-sound" style="cursor: pointer;"><i class="fa-solid fa-volume-high"></i> Chime</label>
            </div>

            <a href="/pos" class="header-nav-btn" title="Open POS Billing Screen">
                <i class="fa-solid fa-cash-register"></i> POS
            </a>
            <a href="/kitchen" class="header-nav-btn" title="Kitchen Display System">
                <i class="fa-solid fa-utensils"></i> Kitchen
            </a>
        </div>
    </header>

    <!-- Top 12 Tables Live Radar -->
    <section class="tables-radar-section">
        <div class="radar-header">
            <span><i class="fa-solid fa-table-cells" style="color: #38bdf8;"></i> 12 Restaurant Tables Live Radar</span>
            <span id="active-tables-summary">0 of 12 Tables Occupied</span>
        </div>
        <div class="tables-grid-bar" id="tables-radar-grid">
            <!-- Rendered via JS for Table 1 to 12 -->
        </div>
    </section>

    <!-- 2-Second Active Order Pop-Up Alert Modal -->
    <div class="live-alert-overlay" id="live-alert-modal">
        <div class="alert-card">
            <div class="alert-top-banner">
                <div class="alert-badge">
                    <i class="fa-solid fa-bell fa-shake"></i>
                    <span id="alert-order-type-badge">NEW ORDER ARRIVED</span>
                </div>
                <div class="countdown-badge">
                    <i class="fa-solid fa-clock"></i>
                    <span id="alert-countdown-text">2s</span>
                </div>
            </div>
            <div class="countdown-progress-bar-container">
                <div class="countdown-progress-bar" id="alert-progress-bar"></div>
            </div>

            <div class="alert-body">
                <div class="alert-table-row">
                    <div class="alert-table-tag" id="alert-table-name">
                        <i class="fa-solid fa-utensils"></i> Table 1
                    </div>
                    <div class="alert-bill-tag" id="alert-bill-no">POS-000001</div>
                </div>

                <div class="alert-items-list" id="alert-items-container">
                    <!-- Dynamic Item Rows -->
                </div>

                <div class="alert-total-row">
                    <div>
                        <span style="font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Total Payable</span>
                        <div style="font-size: 13px; color: #cbd5e1;" id="alert-payment-mode">Mode: CASH</div>
                    </div>
                    <div class="alert-total-val" id="alert-total-amount">₹0.00</div>
                </div>
            </div>

            <div class="alert-actions">
                <button type="button" class="btn-alert-action btn-print-wired" id="btn-alert-print">
                    <i class="fa-solid fa-print"></i> Print to Wired Thermal Printer
                </button>
                <button type="button" class="btn-alert-action btn-pause-timer" id="btn-alert-pause">
                    <i class="fa-solid fa-pause"></i> <span id="pause-btn-text">Pause (2s)</span>
                </button>
                <button type="button" class="btn-alert-action btn-dismiss-alert" id="btn-alert-dismiss">
                    <i class="fa-solid fa-xmark"></i> Dismiss
                </button>
            </div>
        </div>
    </div>

    <!-- Live Orders Feed Section -->
    <main class="feed-container">
        <div class="feed-header">
            <h2>
                <i class="fa-solid fa-receipt" style="color: #38bdf8;"></i> 
                <span>Recent Live Orders</span>
                <span class="feed-badge">Active Queue</span>
            </h2>
            <span style="font-size: 12px; color: #94a3b8; font-family: var(--font-mono);" id="live-server-clock">Syncing...</span>
        </div>

        <div class="feed-grid" id="live-orders-grid">
            <!-- Injected dynamically via JS -->
            <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 50px 20px;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 12px;">Listening for live orders...</p>
            </div>
        </div>
    </main>

    <div id="hidden-receipt-container" style="display: none;"></div>

    <script src="/static/display.js?v=4.0"></script>
</body>

</html>
