# Hotel Mitraya - Spring Boot Server Configuration
server.port=${PORT:5055}
server.servlet.context-path=/
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=MITRAYA_SESSION

# Neon PostgreSQL Cloud Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-round-heart-a5dbtkfd-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_4I3xAbHvLWZD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Static Resources and Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/,file:./static/,file:../static/

# Hotel Mitraya Business Logic Settings
app.pin=2005
